{% set name = "mdformat-beautysh" %}
{% set version = "1.0.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name | replace('-', '_') }}-{{ version }}.tar.gz
  sha256: 10bb22859ffed2a433f2b9b30de4faf7fcdebb9f9d95bd39ecbd437c6a3c686e

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python {{ python_min }}
    - poetry-core
    - pip
  run:
    - python >={{ python_min }}
    - mdformat >=0.3.0
    - beautysh >=6.0.0

test:
  imports:
    - mdformat_beautysh
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/hukkinj1/mdformat-beautysh
  summary: Mdformat plugin to beautify Bash scripts
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - anjos
